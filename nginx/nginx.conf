upstream backend {
    server host.docker.internal:8000;
}

upstream frontend {
    server frontend:80;
}

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name dominiowisp.com www.dominiowisp.com _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name dominiowisp.com www.dominiowisp.com;
    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/dominiowisp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominiowisp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/dominiowisp.com/chain.pem;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # No anunciar la versión exacta de Nginx.
    server_tokens off;

    # ── Cabeceras de seguridad ────────────────────────────────────────────
    # 'always' para que salgan también en las respuestas de error.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # Los tres api.*svg*/iconify son de Iconify: el panel le pide los iconos
    # al vuelo y la librería rota entre esos tres servidores. Comprobado en el
    # navegador: sin los tres, el panel funciona pero se queda sin iconos.
    # Pendiente recomendado: empaquetar los iconos en la compilación
    # (@iconify-json/tabler y @iconify-json/solar + addCollection) para no
    # depender de un tercero ni contarle qué pantallas se usan.
    # Ver la nota en nginx.cloudflare.conf: los orígenes externos son las
    # tipografías de Google y los mapas de OpenStreetMap/ArcGIS.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://api.iconify.design https://api.unisvg.com https://api.simplesvg.com; frame-src 'self' blob:; worker-src 'self' blob:" always;

    # API FastAPI
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Frontend React
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
