# Configuración para despliegue detrás de Cloudflare Tunnel.
#
# Diferencia con nginx.conf (despliegue en VPS con IP pública): aquí NO se
# manejan certificados. El túnel entrega el tráfico ya descifrado en el puerto
# 80 interno, y el HTTPS público lo pone Cloudflare. Por eso no hay bloque 443
# ni rutas a /etc/letsencrypt — que es lo que impediría arrancar a Nginx en una
# máquina sin certificados emitidos.
#
# Para usarla:  cp nginx/nginx.cloudflare.conf nginx/nginx.conf

upstream backend {
    server host.docker.internal:8000;
}

upstream frontend {
    server frontend:80;
}

upstream web {
    server web:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Las redirecciones salen relativas: detrás del túnel el puerto interno es
    # el 80 y nginx lo filtraría en un Location absoluto, mandando al visitante
    # a una URL sin el puerto o sin https.
    absolute_redirect off;

    # El visitante real llega en la cabecera CF-Connecting-IP; sin esto todos
    # los accesos quedarían registrados con la IP interna del túnel.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # API FastAPI
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare ya atendió al cliente por HTTPS: que el backend lo sepa,
        # si no generaría enlaces http:// en un sitio que se sirve en https://
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Panel interno React. proxy_pass SIN barra final: el prefijo /app se conserva
    # y el contenedor también sirve el panel bajo /app/, así la misma compilación
    # funciona por el dominio y por el puerto directo del contenedor en la LAN.
    location /app/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Sin la barra final el navegador pediría /app y nginx no entraría al bloque
    # de arriba: lo mandamos a la forma con barra.
    location = /app {
        return 301 /app/;
    }

    # Sitio público WISP
    location / {
        proxy_pass http://web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
