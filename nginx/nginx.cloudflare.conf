# Configuración para despliegue detrás de Cloudflare Tunnel.
#
# Diferencia con nginx.conf (despliegue en VPS con IP pública): aquí NO se
# manejan certificados. El túnel entrega el tráfico ya descifrado en el puerto
# 80 interno, y el HTTPS público lo pone Cloudflare. Por eso no hay bloque 443
# ni rutas a /etc/letsencrypt — que es lo que impediría arrancar a Nginx en una
# máquina sin certificados emitidos.
#
# Para usarla:  cp nginx/nginx.cloudflare.conf nginx/nginx.conf

upstream backend {
    server host.docker.internal:8000;
}

upstream frontend {
    server frontend:80;
}

upstream web {
    server web:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Las redirecciones salen relativas: detrás del túnel el puerto interno es
    # el 80 y nginx lo filtraría en un Location absoluto, mandando al visitante
    # a una URL sin el puerto o sin https.
    absolute_redirect off;

    # El visitante real llega en la cabecera CF-Connecting-IP; sin esto todos
    # los accesos quedarían registrados con la IP interna del túnel.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # No anunciar la versión exacta de Nginx.
    server_tokens off;

    # ── Cabeceras de seguridad ────────────────────────────────────────────
    # 'always' para que salgan también en las respuestas de error.
    # Cloudflare entrega el sitio por HTTPS, así que HSTS es correcto aquí.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # Los tres api.*svg*/iconify son de Iconify: el panel le pide los iconos
    # al vuelo y la librería rota entre esos tres servidores. Comprobado en el
    # navegador: sin los tres, el panel funciona pero se queda sin iconos.
    # Pendiente recomendado: empaquetar los iconos en la compilación
    # (@iconify-json/tabler y @iconify-json/solar + addCollection) para no
    # depender de un tercero ni contarle qué pantallas se usan.
    # Qué puede cargar la página. Los orígenes externos son los que el sistema
    # usa de verdad: tipografías de Google (sitio público) y los mapas de
    # OpenStreetMap y ArcGIS (zonas, cajas NAP y recorrido de vendedoras).
    # 'unsafe-inline' en style-src es necesario: React, Tailwind y Leaflet
    # escriben estilos directamente en los elementos. blob: en frame-src e
    # img-src es para el recibo en PDF, que se muestra dentro de la página.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://api.iconify.design https://api.unisvg.com https://api.simplesvg.com; frame-src 'self' blob:; worker-src 'self' blob:" always;

    # API FastAPI
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare ya atendió al cliente por HTTPS: que el backend lo sepa,
        # si no generaría enlaces http:// en un sitio que se sirve en https://
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Panel interno React. proxy_pass SIN barra final: el prefijo /app se conserva
    # y el contenedor también sirve el panel bajo /app/, así la misma compilación
    # funciona por el dominio y por el puerto directo del contenedor en la LAN.
    location /app/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Sin la barra final el navegador pediría /app y nginx no entraría al bloque
    # de arriba: lo mandamos a la forma con barra.
    location = /app {
        return 301 /app/;
    }

    # Sitio público WISP
    location / {
        proxy_pass http://web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
