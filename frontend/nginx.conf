server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las redirecciones salen relativas para no perder el puerto ni el dominio
    # cuando se entra por el proxy.
    absolute_redirect off;

    # El panel vive bajo /app/ tanto aquí dentro como detrás del proxy, para que
    # la misma compilación sirva por el dominio y por el puerto directo del
    # contenedor (útil en la LAN durante la prueba).
    location = / {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
}
