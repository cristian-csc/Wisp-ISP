<script>
  const spec = {"openapi": "3.1.0", "info": {"title": "WISP Control · API", "description": "API de **WISP Control**: clientes, pagos, red (zonas, cajas NAP, ONUs, WireGuard y MikroTik), inventario, WhatsApp y permisos.\n\n### Cómo autenticarse\n1. `POST /api/auth/login` con un formulario `username` + `password` (el personal del panel).\n   La app del cliente usa `POST /api/auth/cliente/login` con su DNI.\n2. La respuesta trae `access_token`, un JWT válido por 8 horas.\n3. En cada petición se envía la cabecera `Authorization: Bearer <access_token>`.\n\nEn Swagger, el botón **Authorize** hace el login por ti. En Postman, la petición\n*Auth › Login* guarda el token en la variable `token` y el resto lo usa solo.\n\n### Permisos\nAdemás del tipo de cuenta, cada endpoint pide los módulos del rol (los de *Roles y módulos*).\nSin sesión se responde **401**; con sesión pero sin el módulo, **403**.\n\n### Efectos externos\nCortar, reactivar, aprobar o instalar un cliente ejecuta comandos en el MikroTik de su zona\n(por SSH, a través del túnel WireGuard) y puede mandar WhatsApp. No los pruebes contra\nun entorno con routers y clientes reales.\n", "version": "1.0.0"}, "paths": {"/api/auth/login": {"post": {"tags": ["Auth"], "summary": "Login", "operationId": "login_api_auth_login_post", "requestBody": {"content": {"application/x-www-form-urlencoded": {"schema": {"$ref": "#/components/schemas/Body_login_api_auth_login_post"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Token"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/auth/cliente/login": {"post": {"tags": ["Auth"], "summary": "Cliente Login", "description": "Login para clientes en la app móvil. Usuario y contraseña son su DNI\npor defecto; si el cliente cambió su contraseña desde la app, se valida\ncontra e r NO puede ver la\ncontraseña anterior — solo la reemplaza.", "operationId": "restablecer_password_api_auth_usuarios__usuario_id__password_put", "security": [{"OAuth2PasswordBearer": []}], "parameters": [{"name": "usuario_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Usuario Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResetPassword"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/dashboard/stats": {"get": {"tags": ["Dashboard"], "summary": "Get Stats", "operationId": "get_stats_api_dashboard_stats_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DashboardStats"}}}}}, "security": [{"OAuth2PasswordBearer": []}]}}, "/api/dashboard/ingresos-mensual": {"get": {"tags": ["Dashboard"], "summary": "Ingresos Mensual", "operationId": "ingresos_mensual_api_dashboard_ingresos_mensual_get", "security": [{"OAuth2PasswordBearer": []}], "parameters": [{"name": "anio", "in": "query", "required": false, "schema": {"type": "integer", "title": "Anio"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/dashboard/ultimas-activaciones": {"get": {"tags": ["Dashboard"], "summary": "Ultimas Activaciones", "operationId": "ultimas_activaciones_api_dashboard_ultimas_activaciones_get", "security": [{"OAuth2PasswordBearer": []}], "parameters": [{"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "default": 10, "title": "Limit"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/clientes": {"get": {"tags": ["Clientes"], "summary": "List Clientes", "operationId": "list_clientes_api_clientes_get", "security": [{"OAuth2PasswordBearer": []}], "parameters": [{"name": "page", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "default": 1, "title": "Page"}}, {"name": "per_page", "in": "query", "required": false, "schema": {"type": "integer", "maximum": 100, "minimum": 1, "default": 20, "title": "Per Page"}}, {"name": "search", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Search"}}, {"name": "zona_id", "in": "query", "required": false, "schema": {"anyOf": [{"type": "integer"}, {"type": "null"}], "title": "Zona Id"}}, {"name": "estado", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Estado"}}, {"name": "tipo_conexion", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Tipo Conexion"}}, {"name": "solo_mis_instalaciones", "in": "query", "required": false, "schema": {"type": "boolean", "default": false, "title": "Solo Mis Instalaciones"}}, {"name": "solo_mis_registros", "in": "query", "required": false, "schema": {"type": "boolean", "default": false, "title": "Solo Mis Registros"}}, {"name": "migrado", "in": "query", "required": false, "schema": {"anyOf": [{"type": "boolean"}, {"type": "null"}], "title": "Migrado"}}, {"name": "faltan_datos", "in": "query", "required": false, "schema": {"anyOf": [{"type": "boolean"}, {"type": "null"}], "title": "Faltan Datos"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "object", "title": "Response List Clientes Api Clie }}], "requestBody": {"content": {"application/json": {"schema": {"anyOf": [{"$ref": "#/components/schemas/ClienteAprobarRequest"}, {"type": "null"}], "title": "Data"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/clientes/{cliente_id}/activar-satelital": {"post": {"tags": ["Clientes"], "summary": "Activar Satelital", "description": "Activa un cliente satelital ya aprobado — no hay fibra que tender, así\nque no pasa por /instalar (caja NAP/borne/ONU): acá se registra el equipo\nStarlink entregado y el cliente queda activo de una vez.", "operationId": "activar_satelital_api_clientes__cliente_id__activar_satelital_post", "security": [{"OAuth2PasswordBearer": []}], "parameters": [{"name": "cliente_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Cliente Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClienteActivarSatelitalRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/clientes/{cliente_id}/rechazar": {"post": {"tags": ["Clientes"], "summary": "Rechazar Cliente", "operationId": "rechazar_cliente_api_clientes__cliente_id__rechazar_post", "security": [{"OAuth2PasswordBearer": []}], "parameters": [{"name": "cliente_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Cliente Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClienteRechazarRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schem
