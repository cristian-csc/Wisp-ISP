services:
  # ── Base de datos ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: wisp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # solo localhost — backend host lo accede directamente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wisp_backend
    restart: unless-stopped
    # OJO (seguridad): con network_mode host, uvicorn escucha en el puerto
    # 8000 de TODAS las interfaces del servidor. En un servidor con IP
    # pública eso deja la API accesible saltándose Nginx — sin HTTPS y sin
    # las cabeceras de seguridad. El cortafuegos del servidor DEBE cerrar el
    # 8000 desde fuera (ver MANUAL_PRIVADO_SEGURIDAD_WISP-ISP.md, sección
    # "Puertos que deben estar cerrados"). No se cambia aquí porque Nginx
    # llega al backend por host.docker.internal y atarlo a 127.0.0.1 lo
    # dejaría incomunicado.
    #
    # CUIDADO al escribir esa regla: Nginx vive dentro de Docker y alcanza
    # este backend saliendo por la puerta de enlace del host (172.17.0.1).
    # Un "ufw deny 8000/tcp" a secas también bloquea ESE camino y deja toda
    # la API en 504 — el sitio público y el panel siguen cargando, porque no
    # pasan por el 8000, así que el fallo no se nota hasta que alguien
    # intenta entrar. La regla correcta cierra el puerto por defecto y abre
    # solo el origen de Docker:
    #     sudo ufw allow from 172.16.0.0/12 to any port 8000 proto tcp
    network_mode: host          # comparte red del host → accede a wg0 (10.10.0.x) y localhost:5432
    cap_add:
      - NET_ADMIN               # necesario para wg set / wg show
    environment:
      ENTORNO: ${ENTORNO:-produccion}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_INICIAL_EMAIL: ${ADMIN_INICIAL_EMAIL:-admin}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      SSH_KEY_PATH: ${SSH_KEY_PATH}
      SSH_USER: ${SSH_USER}
      # Para la VPS hace falta root; para los MikroTik, un usuario limitado.
      VPS_SSH_USER: ${VPS_SSH_USER}
      WG_CONFIG_PATH: ${WG_CONFIG_PATH}
      VPS_WG_PUBKEY: ${VPS_WG_PUBKEY}
      VPS_IP: ${VPS_IP}

      # ── Todo lo de abajo faltaba ────────────────────────────────────────
      # El backend lee su configuración de dos sitios: las variables que
      # reciba aquí, y un archivo backend/.env. Ese archivo está en
      # .gitignore, así que en una máquina de desarrollo existe pero en el
      # servidor NO: tras un `git clone` no hay ninguno. Las variables que no
      # estén en esta lista se quedan con el valor por defecto del código, en
      # silencio. Así se descubrió: el token de APIs Perú estaba puesto en el
      # .env del servidor y la consulta de DNI seguía diciendo que no estaba
      # configurada, porque nunca llegaba al contenedor.
      #
      # Los `:-` repiten el valor por defecto de app/config.py: si la
      # variable falta en el .env, el comportamiento es el mismo que antes
      # en vez de quedar en blanco.

      # Sesión
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      # Freno contra adivinación de contraseñas
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-8}
      LOGIN_VENTANA_SEGUNDOS: ${LOGIN_VENTANA_SEGUNDOS:-300}
      LOGIN_BLOQUEO_SEGUNDOS: ${LOGIN_BLOQUEO_SEGUNDOS:-900}

      # Consulta de nombres por DNI/RUC
      APISPERU_URL: ${APISPERU_URL:-https://dniruc.apisperu.com/api/v1}
      APISPERU_TOKEN: ${APISPERU_TOKEN}
      CONSULTAS_LIMITE_MENSUAL: ${CONSULTAS_LIMITE_MENSUAL:-1000}
      CONSULTAS_AVISO_DESDE: ${CONSULTAS_AVISO_DESDE:-950}

      # Facturación
      PRECIO_TV_ADICIONAL: ${PRECIO_TV_ADICIONAL:-10.0}
      DIAS_GRACIA: ${DIAS_GRACIA:-3}

      # Rutas dentro del contenedor (los volúmenes de arriba)
      PHONE_CONTACTO: ${PHONE_CONTACTO:-990807069}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      MEDIA_DIR: ${MEDIA_DIR:-/media}

      # Datos impresos en el recibo. Los vacíos no se imprimen.
      EMPRESA_NOMBRE: ${EMPRESA_NOMBRE:-WISP}
      EMPRESA_RUBRO: ${EMPRESA_RUBRO:-Ingeniería en Redes y Telecomunicaciones}
      EMPRESA_RUC: ${EMPRESA_RUC}
      EMPRESA_DIRECCION: ${EMPRESA_DIRECCION}
      EMPRESA_CIUDAD: ${EMPRESA_CIUDAD:-Juliaca - Puno - Perú}
      EMPRESA_TELEFONOS: ${EMPRESA_TELEFONOS:-990807069}
      EMPRESA_CORREO: ${EMPRESA_CORREO}
    volumes:
      - ./backend:/app
      - /root/.ssh:/root/.ssh:ro              # llave SSH para MikroTik
      - /etc/wireguard:/etc/wireguard:rw      # gestión WireGuard
      - /opt/wisp-isp/backups:/backups        # backups PostgreSQL
      - /opt/wisp-isp/media:/media            # evidencias/fotos y comprobantes
    depends_on:
      postgres:
        condition: service_healthy

  # ── WhatsApp ──────────────────────────────────────────────────────────────────
  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    container_name: wisp_whatsapp
    restart: unless-stopped
    network_mode: host          # accesible en 127.0.0.1:3001 desde el backend
    # Techo de recursos. Con Chromium este servicio llegó a 1,17 GB y 176
    # procesos, dejando sin aire al resto del servidor (4 núcleos, 4,8 GB) y
    # tumbando el túnel de Cloudflare. Baileys no necesita ni de lejos esto,
    # así que el límite funciona como red de seguridad: si algún día algo se
    # desboca, se lleva por delante su propio contenedor y no el servidor.
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 256
    volumes:
      # La sesión vinculada, para no escanear el QR en cada reinicio.
      # Baileys la guarda en otro formato que whatsapp-web.js, de ahí la ruta
      # nueva: la sesión anterior no le sirve y hay que escanear una vez más.
      - whatsapp_session:/app/sesion
    environment:
      PORT: "3001"
      # Solo escucha en la propia máquina: quien pueda llegar a este puerto
      # puede pedir el QR de vinculación y escribir como la empresa.
      BIND_HOST: "127.0.0.1"
      # Misma clave que el backend. Sin ella el bot acepta a cualquiera.
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      SESSION_PATH: /app/sesion

  # ── Sitio público (estático) ──────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wisp_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"   # solo local. El 3001 lo ocupa el servicio de WhatsApp (network_mode: host)

  # ── Panel interno React ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wisp_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"   # solo local: Nginx llega por la red interna de Docker

  # ── Nginx reverse-proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: wisp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # resuelve al host → backend puerto 8000
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  whatsapp_session:
