server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las fotos del hero y el logo no cambian entre despliegues: que el
    # visitante no vuelva a bajar 1.5 MB en cada visita.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # El HTML sí debe revalidarse, si no los cambios de planes o precios
    # tardarían un mes en verse.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
